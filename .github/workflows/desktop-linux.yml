name: Linux desktop development build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'service/**'
      - 'verifier/**'
      - '.github/workflows/desktop-linux.yml'
  push:
    branches: ['feat/linux-desktop']
    paths:
      - 'desktop/**'
      - 'service/**'
      - 'verifier/**'
      - '.github/workflows/desktop-linux.yml'

permissions:
  contents: read

concurrency:
  group: desktop-linux-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux-build:
    name: Build Ubuntu 22.04 x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install native build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config patchelf libwebkit2gtk-4.1-dev libgtk-3-dev \
            libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev \
            pinentry-gtk2 xdg-utils ca-certificates \
            xvfb xauth openbox xdotool imagemagick dbus-x11 fonts-noto-cjk
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            desktop/requirements.txt
            desktop/requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          shared-key: linux-ubuntu2204-x86_64-complete-v1
          cache-on-failure: false
      - name: Build, audit and launch portable application
        run: bash desktop/scripts/build-linux.sh
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SkySeal-Linux-x86_64-build-diagnostics
          path: desktop/.build/linux-x86_64-unknown-linux-gnu/diagnostics/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload development packages
        uses: actions/upload-artifact@v4
        with:
          name: SkySeal-Linux-x86_64-development-unsigned
          path: desktop/.build/linux-x86_64-unknown-linux-gnu/dist/
          if-no-files-found: error
          retention-days: 14

  linux-installed:
    name: Install and launch Ubuntu ${{ matrix.ubuntu }}
    needs: linux-build
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SkySeal-Linux-x86_64-development-unsigned
          path: linux-packages
      - name: Install the actual Debian package and display test tools
        run: |
          cd linux-packages
          sha256sum --check SHA256SUMS.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth openbox xdotool imagemagick dbus-x11 fonts-noto-cjk
          sudo apt-get install -y ./*.deb
      - name: Launch installed application as an ordinary user
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' \
            bash desktop/scripts/linux-test-session.sh \
            python3 desktop/scripts/smoke-installed-linux.py \
            --app-dir /usr/bin --installed \
            --diagnostics "linux-installed-${{ matrix.ubuntu }}"
      - name: Upload installed-application diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SkySeal-Linux-Ubuntu-${{ matrix.ubuntu }}-installed-diagnostics
          path: linux-installed-${{ matrix.ubuntu }}/
          if-no-files-found: warn
          retention-days: 14
