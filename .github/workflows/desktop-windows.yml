name: Windows desktop development build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'service/**'
      - 'verifier/**'
      - 'drive_agent/**'
      - '.github/workflows/desktop-windows.yml'
  push:
    branches: ['feat/windows-local-desktop']
    paths:
      - 'desktop/**'
      - 'service/**'
      - 'verifier/**'
      - 'drive_agent/**'
      - '.github/workflows/desktop-windows.yml'

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  protocol-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r desktop/requirements.txt
      - name: Run existing and desktop protocol tests
        shell: bash
        run: |
          set -euo pipefail
          for suite in verifier/tests service/tests cli/tests drive_agent/tests desktop/tests; do
            python -m unittest discover -s "$suite" -v
          done
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            desktop/requirements.txt
            desktop/requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          shared-key: windows-x86_64-pc-windows-msvc
          cache-on-failure: true
      - name: Build and test the desktop package
        shell: pwsh
        run: ./desktop/scripts/build-windows.ps1
      - name: Install and launch the packaged application
        shell: pwsh
        timeout-minutes: 5
        run: ./desktop/scripts/smoke-installed.ps1
      - name: Upload installed-application diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SkySeal-Windows-installed-smoke
          path: desktop/.build/installed-smoke/
          if-no-files-found: warn
          retention-days: 14
      - name: Record installer checksums
        shell: pwsh
        run: |
          $installerRoot = 'desktop/src-tauri/target/release/bundle/nsis'
          Get-ChildItem $installerRoot -Filter '*.exe' | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf)
          } | Set-Content -Encoding utf8 "$installerRoot/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: SkySeal-Windows-x64-development-unsigned
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            desktop/README.ja.md
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: SkySeal-Windows-x64-engine-diagnostics
          path: desktop/src-tauri/binaries/desktop-engine-x86_64-pc-windows-msvc.exe
          if-no-files-found: error
          retention-days: 14
