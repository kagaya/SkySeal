[package]
name = "skyseal-desktop"
version = "0.3.1"
description = "Local SkySeal research evidence"
authors = ["SkySeal contributors"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
